services:
  terrapanel:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        RUNNER_IMAGE: ${RUNNER_IMAGE:-node:22-bookworm-slim}
    container_name: terrapanel
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3847}:${PORT:-3847}"
      - "${TERRARIA_PORT_START:-7777}-${TERRARIA_PORT_END:-7799}:${TERRARIA_PORT_START:-7777}-${TERRARIA_PORT_END:-7799}/udp"
      - "${TERRARIA_PORT_START:-7777}-${TERRARIA_PORT_END:-7799}:${TERRARIA_PORT_START:-7777}-${TERRARIA_PORT_END:-7799}/tcp"
    environment:
      PORT: ${PORT:-3847}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3847}
      TERRARIA_INSTALL_PATH: /data/terraria
      TERRARIA_DATA_PATH: /data/terraria
      TERRARIA_EXECUTABLE: ${TERRARIA_EXECUTABLE:-TerrariaServer.bin.x86_64}
      TERRARIA_DOWNLOAD_URL: ${TERRARIA_DOWNLOAD_URL:-}
      TERRARIA_SERVER_PORT: ${TERRARIA_SERVER_PORT:-7777}
      TERRARIA_PORT_START: ${TERRARIA_PORT_START:-7777}
      TERRARIA_PORT_END: ${TERRARIA_PORT_END:-7799}
      TERRARIA_MAX_PLAYERS: ${TERRARIA_MAX_PLAYERS:-8}
      TERRARIA_WORLD_PATH: ${TERRARIA_WORLD_PATH:-}
      TERRARIA_WORLD_NAME: ${TERRARIA_WORLD_NAME:-world}
      TERRARIA_WORLD_SIZE: ${TERRARIA_WORLD_SIZE:-2}
      TERRARIA_WORLD_SEED: ${TERRARIA_WORLD_SEED:-}
      TERRARIA_WORLD_DIFFICULTY: ${TERRARIA_WORLD_DIFFICULTY:-0}
      TERRARIA_PASSWORD: ${TERRARIA_PASSWORD:-}
      TERRARIA_MOTD: ${TERRARIA_MOTD:-Welcome to TerraPanel Server}
      TERRARIA_AUTOSAVE_MINUTES: ${TERRARIA_AUTOSAVE_MINUTES:-10}
    volumes:
      - terraria-data:/data/terraria
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$$PORT/api/terraria/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  terraria-data:
